<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-labelledby="t d">
<title id="t">Overlap timeline, October 2026</title>
<desc id="d">Six dated stages from the commit history: old light on 7 October; live means a visible tab on 11 October; the study lounge on 17 October; constellations on 18 October; callsigns and room-scoped conversations on 21 to 23 October; message expiry deployed on 27 October.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B1020"/><stop offset=".55" stop-color="#141433"/><stop offset="1" stop-color="#1E1748"/>
  </linearGradient>
  <radialGradient id="glow" cx=".78" cy=".45" r=".5">
    <stop offset="0" stop-color="#6366F1" stop-opacity=".38"/><stop offset=".6" stop-color="#A78BFA" stop-opacity=".08"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#F5D58A"/></linearGradient>
  <clipPath id="frame"><rect width="1280" height="100%" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1280" height="500" fill="url(#bg)"/>
  <line x1="200" y1="150" x2="1080" y2="150" stroke="#A78BFA" stroke-width="2" stroke-opacity=".45"/>
  <line x1="200" y1="345" x2="1080" y2="345" stroke="#A78BFA" stroke-width="2" stroke-opacity=".45"/>
  <g>
    <path d="M200 139l11 11l-11 11l-11 -11z" fill="#0B1020" stroke="#A78BFA" stroke-width="2.4"/>
    <text x="200" y="118" text-anchor="middle" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.4">7 OCT</text>
    <text x="200" y="200" text-anchor="middle" fill="#E8EAF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Old light</text>
    <text x="200" y="232" text-anchor="middle" fill="#A9ABC4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20">one anonymous star per browser</text>
  </g>
  <g>
    <path d="M640 139l11 11l-11 11l-11 -11z" fill="#0B1020" stroke="#A78BFA" stroke-width="2.4"/>
    <text x="640" y="118" text-anchor="middle" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.4">11 OCT</text>
    <text x="640" y="200" text-anchor="middle" fill="#E8EAF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Live means looking</text>
    <text x="640" y="232" text-anchor="middle" fill="#A9ABC4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20">a visible tab, not a connection</text>
  </g>
  <g>
    <path d="M1080 139l11 11l-11 11l-11 -11z" fill="#0B1020" stroke="#F5D58A" stroke-width="2.4"/>
    <text x="1080" y="118" text-anchor="middle" fill="#F5D58A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.4">17 OCT</text>
    <text x="1080" y="200" text-anchor="middle" fill="#E8EAF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600">A study lounge</text>
    <text x="1080" y="232" text-anchor="middle" fill="#A9ABC4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20">same mechanics, a reason to stay</text>
  </g>
  <g>
    <path d="M200 334l11 11l-11 11l-11 -11z" fill="#0B1020" stroke="#A78BFA" stroke-width="2.4"/>
    <text x="200" y="313" text-anchor="middle" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.4">18 OCT</text>
    <text x="200" y="395" text-anchor="middle" fill="#E8EAF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Constellations</text>
    <text x="200" y="427" text-anchor="middle" fill="#A9ABC4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20">a Common Room and five places</text>
  </g>
  <g>
    <path d="M640 334l11 11l-11 11l-11 -11z" fill="#0B1020" stroke="#A78BFA" stroke-width="2.4"/>
    <text x="640" y="313" text-anchor="middle" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.4">21–23 OCT</text>
    <text x="640" y="395" text-anchor="middle" fill="#E8EAF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Callsigns and rooms</text>
    <text x="640" y="427" text-anchor="middle" fill="#A9ABC4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20">isolation tested at the stream</text>
  </g>
  <g>
    <path d="M1080 334l11 11l-11 11l-11 -11z" fill="#0B1020" stroke="#A78BFA" stroke-width="2.4"/>
    <text x="1080" y="313" text-anchor="middle" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.4">27 OCT</text>
    <text x="1080" y="395" text-anchor="middle" fill="#E8EAF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Expiry deployed</text>
    <text x="1080" y="427" text-anchor="middle" fill="#A9ABC4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20">messages swept after 24 hours</text>
  </g>
  <text x="1252" y="480" text-anchor="end" fill="#A9ABC4" fill-opacity=".75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="1.2">DATES FROM THE COMMIT HISTORY</text>
</g>
</svg>
